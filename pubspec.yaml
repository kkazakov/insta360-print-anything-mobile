name: insta360_print_anything_mobile
description: "Browse recent phone photos and copy one onto a USB-connected Insta360 camera."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Device gallery (MediaStore on Android, PhotoKit later on iOS).
  photo_manager: ^3.12.0
  # Lazily decoded, cached grid thumbnails for photo_manager assets.
  photo_manager_image_provider: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
